server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/monexus_finance?useSSL=false&serverTimezone=America/Sao_Paulo
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    org.hibernate.SQL:

jwt:
  secret: ${JWT_SECRET:03a1f9e6b2d4c8a7f1e3b5d9c2a6f8e0b3d5c7a9f1e3b5d7c9a1f3e5b7d9c1a3}
  expiration: ${JWT_EXPIRATION:86400000}
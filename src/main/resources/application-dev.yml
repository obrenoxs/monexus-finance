server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/monexus_finance?useSSL=false&serverTimezone=America/Sao_Paulo
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  mail:
    from: no-reply@monexusfinance.com
  frontend:
    url: ${FRONTEND_URL:http://localhost:8080}

logging:
  level:
    org.hibernate.SQL:

jwt:
  secret: ${JWT_SECRET:03a1f9e6b2d4c8a7f1e3b5d9c2a6f8e0b3d5c7a9f1e3b5d7c9a1f3e5b7d9c1a3}
  expiration: ${JWT_EXPIRATION:86400000}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}